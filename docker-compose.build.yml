services:
  api:
    image: passage-api:${API_TAG:-mainnet}
    build:
      dockerfile: docker/Dockerfile.node
      target: production
      args:
        WORKSPACE: api

  indexer:
    image: passage-indexer:${INDEXER_TAG:-mainnet}
    build:
      dockerfile: docker/Dockerfile.node
      target: production
      args:
        WORKSPACE: indexer
